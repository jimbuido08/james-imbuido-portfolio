version: 2
updates:
  # Runtime + tooling dependencies, grouped so a week's worth of bumps arrives as
  # a few reviewable PRs rather than a dozen. Two groups exist because those
  # dependencies are *coupled* to something else and cannot be bumped alone:
  #
  #   onnxruntime   coupled to the wasm runtime committed in public/models/ort/;
  #                 a minor release can change inference numerics, which the
  #                 model parity gates exist to detect.
  #   react-three   @react-three/fiber constrains react through a peer range, so
  #                 bumping react alone breaks `npm ci` outright: fiber 9.7.0
  #                 requires `react >=19 <19.3`, so react 19.3.0 needs fiber
  #                 >=9.8.0 (peer `>=19 <19.4`) in the same change.
  #
  # Both groups also list their members in the broad groups' exclude-patterns,
  # rather than relying on group ordering: the docs state no precedence rule for
  # a dependency matching several groups, and empirically ordering did not hold —
  # the first Dependabot PRs still bundled them. Excluding a dependency from every
  # other group leaves it exactly one possible home.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    groups:
      onnxruntime:
        patterns: ["onnxruntime-web"]
      react-three:
        patterns:
          - "react"
          - "react-dom"
          - "@react-three/fiber"
          - "@react-three/drei"
          - "three"
          - "@types/react"
          - "@types/react-dom"
          - "@types/three"
      npm-minor-and-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
        exclude-patterns:
          - "onnxruntime-web"
          - "react"
          - "react-dom"
          - "@react-three/fiber"
          - "@react-three/drei"
          - "three"
          - "@types/react"
          - "@types/react-dom"
          - "@types/three"
      npm-major:
        applies-to: version-updates
        update-types: ["major"]
        exclude-patterns:
          - "onnxruntime-web"
          - "react"
          - "react-dom"
          - "@react-three/fiber"
          - "@react-three/drei"
          - "three"
          - "@types/react"
          - "@types/react-dom"
          - "@types/three"
    ignore:
      # eslint-config-next pulls in typescript-eslint, which does the actual
      # type-aware linting, and its current release declares
      # `typescript >=4.8.4 <6.1.0`. A TypeScript major past that cannot lint at
      # all, so proposing one only produces a permanently red PR. Remove this
      # once typescript-eslint widens the range.
      - dependency-name: "typescript"
        versions: [">=6.1.0"]
    commit-message:
      prefix: "chore(deps)"

  # The workflows pin action majors (actions/checkout@v7 and friends), so
  # keeping them current has to be automated too.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    groups:
      actions:
        applies-to: version-updates
        update-types: ["minor", "patch", "major"]
    commit-message:
      prefix: "chore(ci)"
