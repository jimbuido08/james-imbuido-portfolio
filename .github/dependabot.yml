version: 2
updates:
  # Runtime + tooling dependencies. Grouped so a week's worth of bumps arrives
  # as at most two PRs: routine minor/patch together, majors separately because
  # Next/React/onnxruntime-web majors need deliberate review against the
  # decided stack (CLAUDE.md §14) rather than a rubber stamp.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    groups:
      # onnxruntime-web is not a routine bump: it is coupled to the wasm runtime
      # committed in public/models/ort/, and a minor release can change wasm
      # inference numerics. On its own PR a parity failure is unambiguous — and
      # the ORT sync check in ci.yml will demand `npm run models:wasm` here —
      # instead of being buried among a dozen unrelated bumps.
      #
      # The broad groups below exclude it explicitly rather than relying on
      # group ordering: the docs do not state a precedence rule for a dependency
      # matching several groups, and in practice listing this group first did not
      # take it out of the catch-all (the first two Dependabot PRs still bundled
      # it). Excluding it everywhere else makes this group its only possible
      # home, so the outcome does not depend on undocumented ordering.
      onnxruntime:
        patterns: ["onnxruntime-web"]
      npm-minor-and-patch:
        applies-to: version-updates
        exclude-patterns: ["onnxruntime-web"]
        update-types: ["minor", "patch"]
      npm-major:
        applies-to: version-updates
        exclude-patterns: ["onnxruntime-web"]
        update-types: ["major"]
    commit-message:
      prefix: "chore(deps)"

  # The workflows pin action majors (actions/checkout@v7 and friends), so
  # keeping them current has to be automated too.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    groups:
      actions:
        applies-to: version-updates
        update-types: ["minor", "patch", "major"]
    commit-message:
      prefix: "chore(ci)"
